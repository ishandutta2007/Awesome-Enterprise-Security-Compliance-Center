<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="shield-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".9"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".3"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes orb-float{0%{transform:translateY(0) scale(1);opacity:.35}50%{transform:translateY(-15px) scale(1.08);opacity:.55}}@keyframes radar-sweep{0%{transform:rotate(0deg)}}@keyframes shield-pulse{0%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(56,189,248,.4))}50%{transform:scale(1.03);filter:drop-shadow(0 0 25px rgba(129,140,248,.7))}}@keyframes ping-wave{0%{r:40;opacity:.8;stroke-width:2}}.title-text{font-weight:800;font-size:46px;fill:#fff}.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.pill-text{font-weight:600;font-size:13px;letter-spacing:.5px}.status-text{font-family:&apos;SF Mono&apos;,Consolas,&apos;Liberation Mono&apos;,Menlo,monospace;font-size:12px;fill:#38bdf8}.ambient-orb-1{animation:orb-float 8s ease-in-out infinite}.ambient-orb-2{animation:orb-float 10s ease-in-out infinite reverse}.radar-beam,.shield-icon{transform-origin:1040px 190px}.shield-icon{animation:shield-pulse 5s ease-in-out infinite}.radar-beam{animation:radar-sweep 12s linear infinite}.ping-circle{animation:ping-wave 3s cubic-bezier(0,.2,.8,1) infinite}.flowing-line{stroke-dasharray:8,8;animation:dash-flow 2s linear infinite}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="150" cy="80" r="130" fill="#38bdf8" class="ambient-orb-1" filter="url(#soft-glow)" opacity=".3"/><circle cx="1050" cy="200" r="160" fill="#6366f1" class="ambient-orb-2" filter="url(#soft-glow)" opacity=".3"/><circle cx="650" cy="380" r="140" fill="#c084fc" class="ambient-orb-1" filter="url(#soft-glow)" opacity=".2"/><g class="radar-container"><circle cx="1040" cy="190" r="120" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="1040" cy="190" r="85" fill="none" stroke="#1e293b" stroke-width="1.5"/><circle cx="1040" cy="190" r="50" fill="none" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1"/><circle cx="1040" cy="190" r="40" fill="none" stroke="#38bdf8" class="ping-circle"/><g class="radar-beam"><path fill="url(#shield-grad)" d="M 1040 190 L 1150 150 A 120 120 0 0 1 1160 190 Z" opacity=".35"/></g><path stroke="#38bdf8" stroke-width="2" d="M 860 190 L 980 190" class="flowing-line" opacity=".7"/><g class="shield-icon"><polygon fill="url(#card-grad)" stroke="url(#primary-glow)" stroke-width="2.5" points="1040 140 1085 160 1085 215 1040 245 995 215 995 160"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M 1025 190 L 1036 201 L 1058 179"/><circle cx="1040" cy="225" r="3" fill="#818cf8"/></g></g><g><g transform="translate(80, 0) translate(0, 60)"><rect width="280" height="30" fill="#1e293b" stroke="#334155" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.4;1"/></circle><text x="32" y="20" fill="#38bdf8" class="status-text">ENTERPRISE CLOUD COMPLIANCE</text></g><g transform="translate(80, 0) translate(0, 130)"><text class="title-text">Enterprise Security &amp;</text><text y="54" class="title-text">Compliance Center</text><rect width="220" height="4" y="72" fill="url(#primary-glow)" rx="2"/></g><g><text class="subtitle-text" transform="translate(80, 0) translate(0, 240)">Curated Radar for CSPM, CNAPP, CWPP, eBPF Runtime &amp; Auditing</text><text y="28" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" transform="translate(80, 0) translate(0, 240)">Multi-Cloud Defense • Compliance Automation • Open-Source &amp; SaaS Posture</text></g><g><g transform="translate(80, 0) translate(0, 315) translate(0, 0)"><rect width="115" height="34" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="17"/><circle cx="18" cy="17" r="4" fill="#38bdf8"/><text x="32" y="22" fill="#e2e8f0" class="pill-text">CSPM</text></g><g transform="translate(80, 0) translate(0, 315) translate(130, 0)"><rect width="120" height="34" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" rx="17"/><circle cx="18" cy="17" r="4" fill="#818cf8"/><text x="32" y="22" fill="#e2e8f0" class="pill-text">CNAPP</text></g><g transform="translate(80, 0) translate(0, 315) translate(265, 0)"><rect width="175" height="34" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" rx="17"/><circle cx="18" cy="17" r="4" fill="#c084fc"/