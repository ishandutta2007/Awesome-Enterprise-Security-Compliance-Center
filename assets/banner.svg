<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .status-text {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      fill: #38bdf8;
    }

    /* Ambient Pulsing Animations */
    @keyframes orb-float {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.35; }
      50% { transform: translateY(-15px) scale(1.08); opacity: 0.55; }
    }
    @keyframes radar-sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes shield-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(129, 140, 248, 0.7)); }
    }
    @keyframes ping-wave {
      0% { r: 40; opacity: 0.8; stroke-width: 2; }
      100% { r: 110; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    .ambient-orb-1 {
      animation: orb-float 8s ease-in-out infinite;
    }
    .ambient-orb-2 {
      animation: orb-float 10s ease-in-out infinite reverse;
    }
    .shield-icon {
      transform-origin: 1040px 190px;
      animation: shield-pulse 5s ease-in-out infinite;
    }
    .radar-beam {
      transform-origin: 1040px 190px;
      animation: radar-sweep 12s linear infinite;
    }
    .ping-circle {
      animation: ping-wave 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .flowing-line {
      stroke-dasharray: 8, 8;
      animation: dash-flow 2s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Dynamic Ambient Glowing Orbs (in background) -->
  <circle cx="150" cy="80" r="130" fill="#38bdf8" filter="url(#soft-glow)" class="ambient-orb-1" opacity="0.3" />
  <circle cx="1050" cy="200" r="160" fill="#6366f1" filter="url(#soft-glow)" class="ambient-orb-2" opacity="0.3" />
  <circle cx="650" cy="380" r="140" fill="#c084fc" filter="url(#soft-glow)" class="ambient-orb-1" opacity="0.2" />

  <!-- Animated Cyber Hex / Radar Graphic (Right side illustration) -->
  <g class="radar-container">
    <!-- Concentric radar circles -->
    <circle cx="1040" cy="190" r="120" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4, 4"/>
    <circle cx="1040" cy="190" r="85" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="1040" cy="190" r="50" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Dynamic Radar Pulse Waves -->
    <circle cx="1040" cy="190" r="40" fill="none" stroke="#38bdf8" class="ping-circle" />

    <!-- Sweeping Radar Beam -->
    <g class="radar-beam">
      <path d="M 1040 190 L 1150 150 A 120 120 0 0 1 1160 190 Z" fill="url(#shield-grad)" opacity="0.35"/>
    </g>

    <!-- Animated Data Connector Line -->
    <path d="M 860 190 L 980 190" stroke="#38bdf8" stroke-width="2" class="flowing-line" opacity="0.7"/>

    <!-- Central Security Shield Emblem -->
    <g class="shield-icon">
      <polygon points="1040,140 1085,160 1085,215 1040,245 995,215 995,160" fill="url(#card-grad)" stroke="url(#primary-glow)" stroke-width="2.5"/>
      <!-- Inner Shield Check / Keyhole icon -->
      <path d="M 1025 190 L 1036 201 L 1058 179" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1040" cy="225" r="3" fill="#818cf8"/>
    </g>
  </g>

  <!-- Foreground Content: Header, Badges, Title, Subtitle, Feature Pills -->
  <g transform="translate(80, 0)">
    <!-- Top Tracker Badge / Tag -->
    <g transform="translate(0, 60)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" class="status-text" fill="#38bdf8">ENTERPRISE CLOUD COMPLIANCE</text>
    </g>

    <!-- Main Title with Gradient Glow Accent -->
    <g transform="translate(0, 130)">
      <text class="title-text">
        Enterprise Security &amp;
      </text>
      <text y="54" class="title-text">
        Compliance Center
      </text>
      <!-- Gradient underline -->
      <rect y="72" width="220" height="4" rx="2" fill="url(#primary-glow)"/>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 240)">
      <text class="subtitle-text">
        Curated Radar for CSPM, CNAPP, CWPP, eBPF Runtime &amp; Auditing
      </text>
      <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15px" fill="#64748b">
        Multi-Cloud Defense • Compliance Automation • Open-Source &amp; SaaS Posture
      </text>
    </g>

    <!-- Dynamic Category Feature Pills -->
    <g transform="translate(0, 315)">
      <!-- Pill 1: CSPM -->
      <g transform="translate(0, 0)">
        <rect width="115" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4" fill="#38bdf8"/>
        <text x="32" y="22" fill="#e2e8f0" class="pill-text">CSPM</text>
      </g>

      <!-- Pill 2: CNAPP -->
      <g transform="translate(130, 0)">
        <rect width="120" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4" fill="#818cf8"/>
        <text x="32" y="22" fill="#e2e8f0" class="pill-text">CNAPP</text>
      </g>

      <!-- Pill 3: Runtime Security -->
      <g transform="translate(265, 0)">
        <rect width="175" height="34" rx="17" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4" fill="#c084fc"/>
        <text x="32" y="22" fill="#e2e8f0" class="pill-text">eBPF RUNTIME</text>
      </g>

      <!-- Pill 4: Compliance Frameworks -->
      <g transform="translate(455, 0)">
        <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4" fill="#34d399"/>
        <text x="32" y="22" fill="#e2e8f0" class="pill-text">SOC2 • CIS • NIST • HIPAA</text>
      </g>
    </g>
  </g>

  <!-- Border highlight -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.8"/>
</svg>
